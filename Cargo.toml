[package]
name = "chromiumoxide"
version = "0.10.0"
rust-version = "1.88"
autotests = false
authors = ["Matthias Seitz <matthias.seitz@outlook.de>"]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/garysomerhalder/chromiumoxide"
repository = "https://github.com/garysomerhalder/chromiumoxide"
description = "Chrome DevTools Protocol client with a Playwright-like API"
keywords = ["chrome", "playwright", "puppeteer", "automation", "cdp"]
categories = ["web-programming", "api-bindings", "development-tools::testing"]

[dependencies]
async-tungstenite = { version = "0.32", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
futures = "0.3"
chromiumoxide_types = { path = "chromiumoxide_types", version = "0.10" }
chromiumoxide_cdp = { path = "chromiumoxide_cdp", version = "0.10" }
chromiumoxide_webkit_protocol = { path = "chromiumoxide_webkit_protocol", version = "0.10" }
chromiumoxide_fetcher = { path = "chromiumoxide_fetcher", version = "0.10", default-features = false, optional = true }
serde_json = "1"
which = "8"
thiserror = "2"
url = "2"
regex = "1"
base64 = "0.22"
png = "0.18"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
fnv = "1"
futures-timer = "3"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "time",
  "fs",
  "macros",
  "process",
  "io-util",
  "sync",
  "net",
  "signal",
] }
tracing = "0.1"
pin-project-lite = "0.2"
dunce = "1"
bytes = { version = "1", features = ["serde"], optional = true }
reqwest = { version = "0.13", default-features = false }
p12-keystore = "0.4"
pkcs8 = { version = "0.11", features = ["encryption", "pem", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
base64 = "0.22"
futures = "0.3"
quote = "1"
proc-macro2 = "1"
chrono = "0.4.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

[features]
default = ["bytes"]
fetcher = ["chromiumoxide_fetcher"]
bytes = ["dep:bytes"]

rustls = ["chromiumoxide_fetcher/rustls"]
native-tls = ["chromiumoxide_fetcher/native-tls"]

zip0 = ["chromiumoxide_fetcher/zip0"]
zip8 = ["chromiumoxide_fetcher/zip8"]

[[test]]
name = "architecture"
path = "tests/architecture.rs"

[[test]]
name = "webkit_protocol_names"
path = "tests/webkit_protocol_names.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[workspace]
members = [
  "chromiumoxide_pdl",
  "chromiumoxide_types",
  "chromiumoxide_cdp",
  "chromiumoxide_webkit_protocol",
  "chromiumoxide_fetcher",
]
