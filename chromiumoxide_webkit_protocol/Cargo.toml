[package]
name = "chromiumoxide_webkit_protocol"
version = "0.10.0"
edition = "2024"
rust-version = "1.85"
description = "Types for WebKit's inspector protocol (Playwright's WebKit build), generated from its protocol.json"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/mattsse/chromiumoxide"
repository = "https://github.com/mattsse/chromiumoxide"
readme = "../README.md"
include = ["src/**/*", "protocol/*", "LICENSE-*"]

[dependencies]
chromiumoxide_types = { path = "../chromiumoxide_types", version = "0.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
chromiumoxide_pdl = { path = "../chromiumoxide_pdl", version = "0.10" }
tempfile = "3.10"
