on:
  push:
    branches:
      - main
  pull_request:

name: Continuous integration

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  fmt:
    name: Rustfmt
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: MSRV
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --lib

  test:
    name: Test Core
    needs: [fmt, clippy, msrv]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib

  test-integration:
    name: Test Integration
    needs: [fmt, clippy, msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright 1.65.1 and its Chromium builds
        run: |
          npm install -g playwright@1.65.1
          npx -y playwright@1.65.1 install --with-deps chromium chromium-headless-shell ffmpeg
      - name: Install Electron and Xvfb (Electron tests)
        run: |
          sudo apt-get install -y xvfb
          npm install --prefix "$RUNNER_TEMP/electron" electron
          # On a fresh install, require('electron') first downloads the binary
          # and prints "Downloading Electron binary..."; the path is the last line.
          echo "ELECTRON_PATH=$(node -e "console.log(require('$RUNNER_TEMP/electron/node_modules/electron'))" | tail -n 1)" >> "$GITHUB_ENV"
      - name: Integration and pixel-parity tests
        env:
          CHROMIUMOXIDE_REQUIRE_PARITY: "1"
          CHROMIUMOXIDE_REQUIRE_ELECTRON: "1"
        run: cargo test --test architecture --test integration -- --test-threads=2

  test-fetcher:
    name: Test Fetcher
    needs: [fmt, clippy, msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: RUST_TEST_THREADS=1 cargo test -p chromiumoxide_fetcher

  check-examples:
    name: Check Examples
    needs: [fmt, clippy, msrv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check examples
        run: cargo check --examples
